name: Release performance qualification

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Baseline tag or commit in this repository"
        type: string
        required: true
      scope:
        description: "Full Python+Rust qualification or Rust-core qualification with Python oracle controls"
        type: choice
        options: ["full", "core"]
        default: "full"
      candidate:
        description: "Immutable candidate SHA in the workflow commit ancestry; empty uses that commit"
        type: string
        default: ""
      smoke:
        description: "Short harness check only; does not qualify a release"
        type: boolean
        default: false
      pairs:
        description: "Paired repetitions (release gate needs at least 5)"
        type: number
        default: 5
      requests:
        description: "Measured requests per case (release gate needs at least 100)"
        type: number
        default: 100
      surface_requests:
        description: "Optional space-separated SURFACE=N overrides; each needs at least 100"
        type: string
        default: ""
      warmup:
        description: "Warm-up requests per worker (release gate needs at least 4)"
        type: number
        default: 4
      case_timeout_seconds:
        description: "Per-case process deadline; increase for larger samples"
        type: number
        default: 60
      timeout_minutes:
        description: "Job deadline; larger samples can need longer than the default"
        type: choice
        options: ["90", "180"]
        default: "90"

permissions:
  contents: read

concurrency:
  group: release-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: namespace-profile-puneet-chandna
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Prepare isolated evaluation environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "maturin==1.15.0" "packaging==26.3" "charset_normalizer==3.5.1" "idna==3.19" "urllib3==2.8.0" "certifi==2026.7.22"
      - name: Check out frozen Python oracle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
          path: frozen-oracle
          persist-credentials: false
      - name: Evaluate paired revisions
        env:
          REQUESTS_ORACLE_ROOT: ${{ github.workspace }}/frozen-oracle
          BASE: ${{ inputs.base }}
          CANDIDATE: ${{ inputs.candidate || github.sha }}
          DRIVER_SHA: ${{ github.sha }}
          SCOPE: ${{ inputs.scope }}
          SMOKE: ${{ inputs.smoke }}
          PAIRS: ${{ inputs.pairs }}
          REQUESTS: ${{ inputs.requests }}
          SURFACE_REQUESTS: ${{ inputs.surface_requests }}
          WARMUP: ${{ inputs.warmup }}
          CASE_TIMEOUT: ${{ inputs.case_timeout_seconds }}
        shell: bash
        run: |
          [[ "$SCOPE" == full || "$SCOPE" == core ]]
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$CANDIDATE^{commit}"
          git merge-base --is-ancestor "$CANDIDATE" "$DRIVER_SHA"
          [[ "$(git rev-parse HEAD)" == "$DRIVER_SHA" ]]
          if [[ "$SCOPE" == core ]]; then
            [[ "$GITHUB_REPOSITORY" == puneet-chandna/requests-native && "$GITHUB_REF" == refs/heads/main ]]
          fi
          mode=--gate
          if [[ "$SMOKE" == true ]]; then mode=--smoke; fi
          read -r -a surface_requests <<< "${SURFACE_REQUESTS//$'\n'/ }"
          surface_args=()
          for override in "${surface_requests[@]}"; do
            surface_args+=(--surface-requests "$override")
          done
          evaluation_exit=0
          .venv/bin/python benchmarks/evaluate.py --base "$BASE" --candidate "$CANDIDATE" --scope "$SCOPE" "$mode" \
            --pairs "$PAIRS" --requests "$REQUESTS" --warmup "$WARMUP" \
            --case-timeout-seconds "$CASE_TIMEOUT" --output target/performance-evidence "${surface_args[@]}" || evaluation_exit=$?
          if [[ "$SMOKE" == true ]]; then exit "$evaluation_exit"; fi
          EVALUATION_EXIT="$evaluation_exit" .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          from benchmarks.evaluate import compare_pairs, evaluator_digest

          evidence = Path("target/performance-evidence")
          bases = sorted(evidence.glob("pair-*-base.json"))
          candidates = sorted(evidence.glob("pair-*-candidate.json"))
          assert candidates == [path.with_name(path.name.replace("-base.json", "-candidate.json")) for path in bases]
          pairs = [(json.loads(base.read_text()), json.loads(candidate.read_text())) for base, candidate in zip(bases, candidates)]
          assert all(report["evaluator_sha256"] == evaluator_digest() for pair in pairs for report in pair)
          assert all(report["evaluator_commit"] == os.environ["DRIVER_SHA"] for pair in pairs for report in pair)
          assert all(report["config"]["qualification_scope"] == os.environ["SCOPE"] for pair in pairs for report in pair)
          result = compare_pairs(pairs, budget=0.20, gate=True, scope=os.environ["SCOPE"])
          assert result["qualification_scope"] == os.environ["SCOPE"] and result["evaluator_commit"] == os.environ["DRIVER_SHA"]
          assert result["sources"][1] == os.environ["CANDIDATE"]
          assert json.loads((evidence / "comparison.json").read_text()) == {**result, "smoke_only": False}
          assert result["status"] in ("passed", "inconclusive") and not result["insufficient_release_evidence"]
          assert all(metric["case"][0] == "python-oracle" or metric["status"] != "regression" for metric in result["metrics"]), "Confirmed native performance regressions block qualification even when controls are unstable"
          assert int(os.environ["EVALUATION_EXIT"]) == (0 if result["status"] == "passed" else 1)
          if result["status"] == "inconclusive":
              print("::warning::Complete performance evidence is inconclusive; release policy permits qualification without a performance parity or superiority claim. See comparison.json for unchanged ratios, confidence intervals and control uncertainty.")
          PY
      - name: Preserve raw measurements and decision
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: performance-evidence
          path: |
            target/performance-evidence/*.json
            target/performance-evidence/*.log
          if-no-files-found: warn
          retention-days: ${{ inputs.smoke && 14 || 30 }}
