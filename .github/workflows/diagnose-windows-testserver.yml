name: Diagnose Windows free-threaded test server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-testserver-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14t"
      - name: Prepare bounded diagnostic
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/testserver-diagnostic"
          python -m pip install "maturin==1.15.0"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUNNER_TEMP/testserver-diagnostic/source-commit.log"
      - name: Build one sanitized diagnostic wheel
        shell: bash
        run: |
          python scripts/build_release_wheel.py --interpreter python --out wheelhouse > "$RUNNER_TEMP/testserver-diagnostic/build.log" 2>&1
          wheel="$(find wheelhouse -maxdepth 1 -type f -name '*.whl' -print -quit)"
          python tests_rust/test_distribution.py --verify-wheel "$wheel" --source-commit "$GITHUB_SHA" >> "$RUNNER_TEMP/testserver-diagnostic/build.log" 2>&1
      - name: Install independent environments with identical dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/diagnostic-candidate"
          python -m venv "$RUNNER_TEMP/diagnostic-oracle"
          candidate_python="$RUNNER_TEMP/diagnostic-candidate/Scripts/python.exe"
          oracle_python="$RUNNER_TEMP/diagnostic-oracle/Scripts/python.exe"
          wheel="$(find wheelhouse -maxdepth 1 -type f -name '*.whl' -print -quit)"
          "$candidate_python" -m pip install "$wheel" "pytest>=6.2,<10" "pytest-httpbin==2.1.0" "httpbin~=0.10.0" trustme "PySocks>=1.5.6,!=1.5.7" > "$RUNNER_TEMP/testserver-diagnostic/install.log" 2>&1
          "$candidate_python" -m pip freeze --exclude requests-native > "$RUNNER_TEMP/testserver-diagnostic/dependencies.log"
          "$oracle_python" -m pip install -r "$RUNNER_TEMP/testserver-diagnostic/dependencies.log" >> "$RUNNER_TEMP/testserver-diagnostic/install.log" 2>&1
      - name: Read frozen oracle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
          path: frozen-oracle
          persist-credentials: false
      - name: Observe each upstream suite once outside the checkouts
        shell: bash
        run: |
          python scripts/diagnose_windows_testserver.py \
            --candidate-python "$RUNNER_TEMP/diagnostic-candidate/Scripts/python.exe" \
            --oracle-python "$RUNNER_TEMP/diagnostic-oracle/Scripts/python.exe" \
            --oracle-root "$GITHUB_WORKSPACE/frozen-oracle" \
            --output "$RUNNER_TEMP/testserver-diagnostic"
      - name: Retain private diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-314t-testserver-diagnostic
          path: |
            ${{ runner.temp }}/testserver-diagnostic/**/*.log
            ${{ runner.temp }}/testserver-diagnostic/**/*.json
            ${{ runner.temp }}/testserver-diagnostic/**/*.jsonl
          if-no-files-found: warn
          retention-days: 5
