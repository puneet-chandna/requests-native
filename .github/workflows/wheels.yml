name: Compiled wheel matrix

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - LICENSE
      - NOTICE
      - pyproject.toml
      - requirements-dev.txt
      - "src/**"
      - "tests/**"
      - "tests_differential/**"
      - tests_rust/test_backend_boundary.py
      - tests_rust/test_distribution.py
      - .github/workflows/wheels.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - LICENSE
      - NOTICE
      - pyproject.toml
      - requirements-dev.txt
      - "src/**"
      - "tests/**"
      - "tests_differential/**"
      - tests_rust/test_backend_boundary.py
      - tests_rust/test_distribution.py
      - .github/workflows/wheels.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15-dev", "pypy-3.11"]
        os: [ubuntu-22.04, macos-latest, windows-latest]
        exclude:
          - {python: "pypy-3.11", os: windows-latest}
    env:
      CARGO_TERM_COLOR: always
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: ${{ matrix.python == '3.15-dev' && '1' || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install maturin
        run: python -m pip install "maturin>=1.13,<2"
      - name: Build wheel
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python -m maturin build --interpreter python --manylinux 2_34 --out wheelhouse
          else
            python -m maturin build --interpreter python --out wheelhouse
          fi
      - name: Verify exact wheel contents
        shell: bash
        run: |
          wheel="$(find wheelhouse -maxdepth 1 -type f -name '*.whl' -print -quit)"
          python tests_rust/test_distribution.py --verify-wheel "$wheel"
      - name: Install wheel and explicit test dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/requests-wheel-smoke"
          wheel="$(find wheelhouse -maxdepth 1 -type f -name '*.whl' -print -quit)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            smoke_python="$RUNNER_TEMP/requests-wheel-smoke/Scripts/python.exe"
          else
            smoke_python="$RUNNER_TEMP/requests-wheel-smoke/bin/python"
          fi
          echo "SMOKE_PYTHON=$smoke_python" >> "$GITHUB_ENV"
          "$smoke_python" -m pip install \
            "$wheel" \
            "pytest>=6.2,<10" \
            "pytest-httpbin==2.1.0" \
            "httpbin~=0.10.0" \
            "trustme" \
            "PySocks>=1.5.6,!=1.5.7"
      - name: Check out frozen Python oracle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
          path: frozen-oracle
          persist-credentials: false
      - name: Record free-threaded ABI evidence
        if: matrix.python == '3.14t'
        shell: bash
        run: |
          wheel="$(find wheelhouse -maxdepth 1 -type f -name '*.whl' -print -quit)"
          [[ "$(basename "$wheel")" == *-cp314-cp314t-* ]]
          "$SMOKE_PYTHON" -c 'import json, pathlib, sys, sysconfig; before = sys._is_gil_enabled(); import requests._requests_rust; after = sys._is_gil_enabled(); evidence = {"Py_GIL_DISABLED": sysconfig.get_config_var("Py_GIL_DISABLED"), "before_import": before, "after_import": after}; assert evidence["Py_GIL_DISABLED"] == 1; pathlib.Path("wheelhouse/free-threaded-evidence-${{ matrix.os }}.json").write_text(json.dumps(evidence, sort_keys=True) + "\n")'
      - name: Run installed artifact suite once
        shell: bash
        run: python tests_rust/test_distribution.py --installed-suite "$SMOKE_PYTHON" --oracle "$GITHUB_WORKSPACE/frozen-oracle" "$GITHUB_WORKSPACE"
      - name: Upload wheel
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheel-${{ matrix.python }}-${{ matrix.os }}
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 5
