name: Compiled wheel matrix

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - AUTHORS.rst
      - "crates/**"
      - LICENSE
      - NOTICE
      - RUST_RUNTIME_NOTICES.html
      - pyproject.toml
      - requirements-dev.txt
      - rust-toolchain.toml
      - scripts/build_release_wheel.py
      - scripts/generate_release_sbom.py
      - "src/**"
      - "tests/**"
      - "tests_differential/**"
      - tests_rust/test_backend_boundary.py
      - tests_rust/test_distribution.py
      - .github/workflows/wheels.yml
      - .github/workflows/build-wheel.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows-first:
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15-dev"]
    uses: ./.github/workflows/build-wheel.yml
    with:
      python: ${{ matrix.python }}
      os: windows-latest

  wheels:
    needs: windows-first
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15-dev", "pypy-3.11"]
        os: [ubuntu-22.04, macos-latest]
    uses: ./.github/workflows/build-wheel.yml
    with:
      python: ${{ matrix.python }}
      os: ${{ matrix.os }}
