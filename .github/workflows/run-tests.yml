# Requests Native modification notice: this retained file differs from Requests 2.34.2.
name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "benchmarks/**"
      - .github/workflows/**
      - API_COMPATIBILITY.tsv
      - AUTHORS.rst
      - HISTORY.md
      - LICENSE
      - LIFETIMES.tsv
      - Makefile
      - NOTICE
      - ORACLE.lock
      - README.md
      - RUST_RUNTIME_NOTICES.html
      - pyproject.toml
      - requirements-dev.txt
      - rust-toolchain.toml
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "tests_differential/**"
      - "tests_rust/**"
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "benchmarks/**"
      - .github/workflows/**
      - API_COMPATIBILITY.tsv
      - AUTHORS.rst
      - HISTORY.md
      - LICENSE
      - LIFETIMES.tsv
      - Makefile
      - NOTICE
      - ORACLE.lock
      - README.md
      - RUST_RUNTIME_NOTICES.html
      - pyproject.toml
      - requirements-dev.txt
      - rust-toolchain.toml
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "tests_differential/**"
      - "tests_rust/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Editable anchor (3.14, Namespace Linux)
    runs-on: namespace-profile-puneet-chandna
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Set up Python 3.14
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.14"
        cache: 'pip'
    - name: Install dependencies
      run: |
        make
    - name: Run Rust default backend tests
      run: |
        echo "Rust default backend"
        make ci
    - name: Check out frozen Python oracle
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: psf/requests
        ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
        path: frozen-oracle
        persist-credentials: false
    - name: Run explicit Rust trial backend tests
      env:
        REQUESTS_ORACLE_ROOT: ${{ github.workspace }}/frozen-oracle
      run: |
        echo "Explicit Rust trial backend"
        python -m pytest -q tests_rust/test_backend_boundary.py tests_differential/test_property_boundaries.py
    - name: Run native and rewrite regression checks
      env:
        REQUESTS_ORACLE_ROOT: ${{ github.workspace }}/frozen-oracle
      run: |
        cargo test -p requests-native --locked
        cargo test --manifest-path benchmarks/rust-native/Cargo.toml --locked --target-dir target
        python scripts/check_ledgers.py --completion
        python scripts/compare_windows_tls.py --self-check
        python -m unittest benchmarks.test_run benchmarks.test_evaluate
    - name: Build canonical artifacts for distribution regression checks
      shell: bash
      run: |
        python -m pip install "maturin==1.15.0"
        export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
        python scripts/build_release_wheel.py --interpreter "$(command -v python)" --out dist --manylinux 2_34
        python -m maturin sdist --out dist
    - name: Run full rewrite and differential regression suite
      env:
        REQUESTS_ORACLE_ROOT: ${{ github.workspace }}/frozen-oracle
      run: |
        python -m pytest -q tests_rust tests_differential

  no_chardet:
    name: "No Character Detection"
    runs-on: namespace-profile-puneet-chandna
    timeout-minutes: 15
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: 'Set up Python 3.10'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          make
          python -m pip uninstall -y "charset_normalizer" "chardet"
      - name: Run Rust default backend tests
        run: |
          echo "Rust default backend"
          python tests_rust/test_distribution.py --compatibility-smoke no-detector --backend default
          make ci
      - name: Check out frozen Python oracle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
          path: frozen-oracle
          persist-credentials: false
      - name: Run explicit Rust trial backend tests
        env:
          REQUESTS_ORACLE_ROOT: ${{ github.workspace }}/frozen-oracle
        run: |
          echo "Explicit Rust trial backend"
          python tests_rust/test_distribution.py --compatibility-smoke no-detector --backend trial
          python -m pytest -q tests_rust/test_backend_boundary.py tests_differential/test_property_boundaries.py

  urllib3:
    name: 'urllib3 1.x'
    runs-on: namespace-profile-puneet-chandna
    timeout-minutes: 15
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: 'Set up Python 3.10'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          make
          python  -m pip install "urllib3<2"
      - name: Run Rust default backend tests
        run: |
          echo "Rust default backend"
          python tests_rust/test_distribution.py --compatibility-smoke urllib3-1 --backend default
          make ci
      - name: Check out frozen Python oracle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
          path: frozen-oracle
          persist-credentials: false
      - name: Run explicit Rust trial backend tests
        env:
          REQUESTS_ORACLE_ROOT: ${{ github.workspace }}/frozen-oracle
        run: |
          echo "Explicit Rust trial backend"
          python tests_rust/test_distribution.py --compatibility-smoke urllib3-1 --backend trial
          python -m pytest -q tests_rust/test_backend_boundary.py tests_differential/test_property_boundaries.py
