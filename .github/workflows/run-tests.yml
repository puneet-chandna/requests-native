name: Tests

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - .github/workflows/**
      - API_COMPATIBILITY.tsv
      - HISTORY.md
      - LICENSE
      - LIFETIMES.tsv
      - MANIFEST.in
      - Makefile
      - NOTICE
      - ORACLE.lock
      - README.md
      - pyproject.toml
      - requirements-dev.txt
      - "scripts/**"
      - setup.py
      - "src/**"
      - "tests/**"
      - "tests_differential/**"
      - "tests_rust/**"
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - .github/workflows/**
      - API_COMPATIBILITY.tsv
      - HISTORY.md
      - LICENSE
      - LIFETIMES.tsv
      - MANIFEST.in
      - Makefile
      - NOTICE
      - ORACLE.lock
      - README.md
      - pyproject.toml
      - requirements-dev.txt
      - "scripts/**"
      - setup.py
      - "src/**"
      - "tests/**"
      - "tests_differential/**"
      - "tests_rust/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Editable anchor (3.14, ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Set up Python 3.14
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.14"
        cache: 'pip'
    - name: Install dependencies
      run: |
        make
    - name: Run Rust default backend tests
      run: |
        echo "Rust default backend"
        make ci
    - name: Check out frozen Python oracle
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: psf/requests
        ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
        path: frozen-oracle
        persist-credentials: false
    - name: Run explicit Rust trial backend tests
      env:
        REQUESTS_ORACLE_ROOT: ${{ github.workspace }}/frozen-oracle
      run: |
        echo "Explicit Rust trial backend"
        python -m pytest -q tests_rust/test_backend_boundary.py tests_differential/test_property_boundaries.py

  no_chardet:
    name: "No Character Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: 'Set up Python 3.10'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          make
          python -m pip uninstall -y "charset_normalizer" "chardet"
      - name: Run Rust default backend tests
        run: |
          echo "Rust default backend"
          python tests_rust/test_distribution.py --compatibility-smoke no-detector --backend default
          make ci
      - name: Check out frozen Python oracle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
          path: frozen-oracle
          persist-credentials: false
      - name: Run explicit Rust trial backend tests
        env:
          REQUESTS_ORACLE_ROOT: ${{ github.workspace }}/frozen-oracle
        run: |
          echo "Explicit Rust trial backend"
          python tests_rust/test_distribution.py --compatibility-smoke no-detector --backend trial
          python -m pytest -q tests_rust/test_backend_boundary.py tests_differential/test_property_boundaries.py

  urllib3:
    name: 'urllib3 1.x'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: 'Set up Python 3.10'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          make
          python  -m pip install "urllib3<2"
      - name: Run Rust default backend tests
        run: |
          echo "Rust default backend"
          python tests_rust/test_distribution.py --compatibility-smoke urllib3-1 --backend default
          make ci
      - name: Check out frozen Python oracle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
          path: frozen-oracle
          persist-credentials: false
      - name: Run explicit Rust trial backend tests
        env:
          REQUESTS_ORACLE_ROOT: ${{ github.workspace }}/frozen-oracle
        run: |
          echo "Explicit Rust trial backend"
          python tests_rust/test_distribution.py --compatibility-smoke urllib3-1 --backend trial
          python -m pytest -q tests_rust/test_backend_boundary.py tests_differential/test_property_boundaries.py
