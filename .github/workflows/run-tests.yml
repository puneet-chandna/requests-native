name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15-dev", "pypy-3.11"]
        os: [ubuntu-22.04, macOS-latest, windows-latest]
        # Pypy-3.11 can't install openssl-sys with rust
        # which prevents us from testing in GHA.
        exclude:
        - { python-version: "pypy-3.11", os: "windows-latest" }

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        allow-prereleases: true
    - name: Install dependencies
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: ${{ matrix.python-version == '3.15-dev' && '1' || '' }}
      run: |
        make
    - name: Run default Python backend tests
      run: |
        echo "Default Python backend"
        make ci
    - name: Check out frozen Python oracle
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: psf/requests
        ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
        path: frozen-oracle
        persist-credentials: false
    - name: Run explicit Rust trial backend tests
      env:
        REQUESTS_ORACLE_ROOT: ${{ github.workspace }}/frozen-oracle
      run: |
        echo "Explicit Rust trial backend"
        python -m pytest -q tests_rust/test_backend_boundary.py tests_differential/test_property_boundaries.py

  no_chardet:
    name: "No Character Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: 'Set up Python 3.10'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          make
          python -m pip uninstall -y "charset_normalizer" "chardet"
      - name: Run default Python backend tests
        run: |
          echo "Default Python backend"
          python tests_rust/test_distribution.py --compatibility-smoke no-detector --backend default
          make ci
      - name: Check out frozen Python oracle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
          path: frozen-oracle
          persist-credentials: false
      - name: Run explicit Rust trial backend tests
        env:
          REQUESTS_ORACLE_ROOT: ${{ github.workspace }}/frozen-oracle
        run: |
          echo "Explicit Rust trial backend"
          python tests_rust/test_distribution.py --compatibility-smoke no-detector --backend trial
          python -m pytest -q tests_rust/test_backend_boundary.py tests_differential/test_property_boundaries.py

  urllib3:
    name: 'urllib3 1.x'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: 'Set up Python 3.10'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          make
          python  -m pip install "urllib3<2"
      - name: Run default Python backend tests
        run: |
          echo "Default Python backend"
          python tests_rust/test_distribution.py --compatibility-smoke urllib3-1 --backend default
          make ci
      - name: Check out frozen Python oracle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
          path: frozen-oracle
          persist-credentials: false
      - name: Run explicit Rust trial backend tests
        env:
          REQUESTS_ORACLE_ROOT: ${{ github.workspace }}/frozen-oracle
        run: |
          echo "Explicit Rust trial backend"
          python tests_rust/test_distribution.py --compatibility-smoke urllib3-1 --backend trial
          python -m pytest -q tests_rust/test_backend_boundary.py tests_differential/test_property_boundaries.py
