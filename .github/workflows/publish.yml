name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test-pypi-only:
        description: "Publish validated artifacts to Test PyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install maturin
        run: python -m pip install "maturin>=1.13,<2"
      - name: Build sdist
        run: python -m maturin sdist --out dist
      - name: Verify exact sdist contents
        shell: bash
        run: |
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          python tests_rust/test_distribution.py --verify-sdist "$sdist"
      - name: Install sdist and explicit test dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/requests-sdist-smoke"
          smoke_python="$RUNNER_TEMP/requests-sdist-smoke/bin/python"
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          echo "SDIST_PYTHON=$smoke_python" >> "$GITHUB_ENV"
          "$smoke_python" -m pip install \
            "$sdist" \
            "pytest>=6.2,<10" \
            "pytest-httpbin==2.1.0" \
            "httpbin~=0.10.0" \
            "trustme" \
            "PySocks>=1.5.6,!=1.5.7"
      - name: Check out frozen Python oracle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
          path: frozen-oracle
          persist-credentials: false
      - name: Run installed artifact suite once
        run: python tests_rust/test_distribution.py --installed-suite "$SDIST_PYTHON" --oracle "$GITHUB_WORKSPACE/frozen-oracle" "$GITHUB_WORKSPACE"
      - name: Upload sdist
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  wheels:
    uses: ./.github/workflows/wheels.yml

  manifest:
    name: Validate release artifact manifest
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download sdist
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: sdist
          path: artifacts/sdist
      - name: Download wheel fan-out separately
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: wheel-*
          path: artifacts/wheels
      - name: Fetch GitHub artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > artifact-metadata.json
      - name: Validate exact artifact fan-out
        env:
          WHEELS_RESULT: ${{ needs.wheels.result }}
        run: python tests_rust/test_distribution.py --verify-manifest artifacts --source-commit "$GITHUB_SHA" --matrix-result "$WHEELS_RESULT" --artifact-metadata artifact-metadata.json > artifact-manifest.json
      - name: Assemble validated release directory
        shell: bash
        run: |
          mkdir dist
          find artifacts -type f -name '*.whl' -exec cp '{}' dist/ \;
          find artifacts -type f -name '*.tar.gz' -exec cp '{}' dist/ \;
      - name: Upload validated release artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-dist
          path: |
            dist/
            artifact-manifest.json
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [manifest]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: publish
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-dist
          path: release
      - name: Publish dists to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: release/dist
          attestations: true

  publish-test-pypi:
    name: Publish to Test PyPI
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.test-pypi-only
    needs: [manifest]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-dist
          path: release
      - name: Publish dists to Test PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: release/dist
          repository-url: https://test.pypi.org/legacy/
          attestations: true
