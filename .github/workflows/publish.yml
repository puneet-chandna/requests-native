name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test-pypi-only:
        description: "Publish to Test PyPI only"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install maturin
        run: python -m pip install "maturin>=1.13,<2"
      - name: Build sdist
        run: python -m maturin sdist --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v6.0.0
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  wheels:
    uses: ./.github/workflows/wheels.yml

  manifest:
    name: Validate release artifact manifest
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download sdist
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: sdist
          path: artifacts/sdist
      - name: Download wheel fan-out separately
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: wheel-*
          path: artifacts/wheels
      - name: Validate exact artifact fan-out
        run: python tests_rust/test_distribution.py --verify-manifest artifacts > artifact-manifest.json
      - name: Assemble validated release directory
        shell: bash
        run: |
          mkdir dist
          find artifacts -type f -name '*.whl' -exec cp '{}' dist/ \;
          find artifacts -type f -name '*.tar.gz' -exec cp '{}' dist/ \;
      - name: Upload validated release artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v6.0.0
        with:
          name: release-dist
          path: |
            dist/
            artifact-manifest.json
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [manifest]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: publish
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-dist
          path: release
      - name: Publish dists to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: release/dist
          attestations: true

  publish-test-pypi:
    name: Publish to Test PyPI
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.test-pypi-only
    needs: [manifest]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-dist
          path: release
      - name: Publish dists to Test PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: release/dist
          repository-url: https://test.pypi.org/legacy/
          attestations: true
