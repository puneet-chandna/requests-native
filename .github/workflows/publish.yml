# Requests Native modification notice: this retained file differs from Requests 2.34.2.
name: Validate beta artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Existing qualified artifact run; leave empty to build all artifacts"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: beta-artifact-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    if: ${{ inputs.artifact_run_id == '' }}
    name: Build sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install maturin
        run: python -m pip install "maturin==1.15.0"
      - name: Build sdist
        run: python -m maturin sdist --out dist
      - name: Verify exact sdist contents
        shell: bash
        run: |
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          python tests_rust/test_distribution.py --verify-sdist "$sdist" --source-commit "$GITHUB_SHA"
      - name: Install sdist and explicit test dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/requests-sdist-smoke"
          smoke_python="$RUNNER_TEMP/requests-sdist-smoke/bin/python"
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          echo "SDIST_PYTHON=$smoke_python" >> "$GITHUB_ENV"
          "$smoke_python" -m pip install \
            "$sdist" \
            "pytest>=6.2,<10" \
            "pytest-httpbin==2.1.0" \
            "httpbin~=0.10.0" \
            "trustme" \
            "PySocks>=1.5.6,!=1.5.7"
      - name: Check out frozen Python oracle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
          path: frozen-oracle
          persist-credentials: false
      - name: Run installed artifact suite once
        run: python tests_rust/test_distribution.py --installed-suite "$SDIST_PYTHON" --oracle "$GITHUB_WORKSPACE/frozen-oracle" "$GITHUB_WORKSPACE"
      - name: Upload sdist
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  wheels:
    if: ${{ inputs.artifact_run_id == '' }}
    uses: ./.github/workflows/wheels.yml

  manifest:
    name: Validate release artifact manifest
    needs: [sdist, wheels]
    if: ${{ !cancelled() && (inputs.artifact_run_id != '' || (needs.sdist.result == 'success' && needs.wheels.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve qualified artifact source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.artifact_run_id || github.run_id }}
        shell: bash
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
          source_sha=$(jq -er --arg repo "$GITHUB_REPOSITORY" '
            select(.head_repository.full_name == $repo and .path == ".github/workflows/publish.yml")
            | .head_sha | select(test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/source-run.json")
          jq -e '[.jobs[] | select(.name == "Build sdist" or (.name | endswith(" / wheel")))]
            | length == 24 and all(.[]; .conclusion == "success")' "$RUNNER_TEMP/source-jobs.json"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "run=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Prepare locked Rust dependencies
        run: cargo fetch --locked
      - name: Download sdist
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: sdist
          path: artifacts/sdist
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
      - name: Download wheel fan-out separately
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: wheel-*
          path: artifacts/wheels
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
      - name: Fetch GitHub artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        run: gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > artifact-metadata.json
      - name: Validate exact artifact fan-out
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python tests_rust/test_distribution.py --verify-manifest artifacts --source-commit "$SOURCE_SHA" --matrix-result success --artifact-metadata artifact-metadata.json > artifact-manifest.json
      - name: Assemble complete release set
        shell: bash
        run: |
          mkdir dist
          find artifacts -type f -name '*.whl' -exec cp '{}' dist/ \;
          find artifacts -type f -name '*.tar.gz' -exec cp '{}' dist/ \;
          cp artifact-manifest.json dist/
      - name: Verify complete release set
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python tests_rust/test_distribution.py --verify-release-set dist --manifest dist/artifact-manifest.json --source-commit "$SOURCE_SHA"
      - name: Upload complete release set
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: beta-release-set
          path: dist/
          if-no-files-found: error
          retention-days: 5
