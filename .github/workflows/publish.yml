# Requests Native modification notice: this retained file differs from Requests 2.34.2.
name: Validate release artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Existing qualified artifact run; leave empty to build all artifacts"
        type: string
        required: false
        default: ""
      publish_pypi:
        description: "Publish the qualified stable release to PyPI after environment approval"
        type: boolean
        default: false
      publish_crates:
        description: "Publish the qualified stable core crate after environment approval"
        type: boolean
        default: false
      source_run_id:
        description: "Successful exact-source Tests run; required for publication"
        type: string
        default: ""
      performance_run_id:
        description: "Successful exact-source full performance gate run; required for publication"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-artifact-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdist:
    if: ${{ inputs.artifact_run_id == '' }}
    name: Build sdist
    runs-on: namespace-profile-puneet-chandna
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install maturin
        run: python -m pip install "maturin==1.15.0"
      - name: Build sdist
        run: python -m maturin sdist --out dist
      - name: Verify exact sdist contents
        shell: bash
        run: |
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          python tests_rust/test_distribution.py --verify-sdist "$sdist" --source-commit "$GITHUB_SHA"
      - name: Install sdist and explicit test dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/requests-sdist-smoke"
          smoke_python="$RUNNER_TEMP/requests-sdist-smoke/bin/python"
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          echo "SDIST_PYTHON=$smoke_python" >> "$GITHUB_ENV"
          "$smoke_python" -m pip install \
            "$sdist" \
            "pytest>=6.2,<10" \
            "pytest-httpbin==2.1.0" \
            "httpbin~=0.10.0" \
            "trustme" \
            "PySocks>=1.5.6,!=1.5.7"
      - name: Check out frozen Python oracle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
          path: frozen-oracle
          persist-credentials: false
      - name: Run installed artifact suite once
        run: python tests_rust/test_distribution.py --installed-suite "$SDIST_PYTHON" --oracle "$GITHUB_WORKSPACE/frozen-oracle" "$GITHUB_WORKSPACE"
      - name: Upload sdist
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  wheels:
    if: ${{ inputs.artifact_run_id == '' }}
    uses: ./.github/workflows/wheels.yml

  manifest:
    name: Validate release artifact manifest
    needs: [sdist, wheels]
    if: ${{ !cancelled() && (inputs.artifact_run_id != '' || (needs.sdist.result == 'success' && needs.wheels.result == 'success')) }}
    runs-on: namespace-profile-puneet-chandna
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve qualified artifact source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.artifact_run_id || github.run_id }}
        shell: bash
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
          source_sha=$(jq -er --arg repo "$GITHUB_REPOSITORY" '
            select(.head_repository.full_name == $repo and .path == ".github/workflows/publish.yml")
            | .head_sha | select(test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/source-run.json")
          jq -e '[.jobs[] | select(.name == "Build sdist" or (.name | endswith(" / wheel")))]
            | length == 24 and all(.[]; .conclusion == "success")' "$RUNNER_TEMP/source-jobs.json"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "run=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use current artifact validator
        env:
          VALIDATOR_SHA: ${{ github.sha }}
        run: git show "$VALIDATOR_SHA:tests_rust/test_distribution.py" > tests_rust/test_distribution.py
      - name: Prepare locked Rust dependencies
        run: cargo fetch --locked
      - name: Download sdist
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: sdist
          path: artifacts/sdist
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
      - name: Download wheel fan-out separately
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: wheel-*
          path: artifacts/wheels
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
      - name: Fetch GitHub artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        run: gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > artifact-metadata.json
      - name: Validate exact artifact fan-out
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python tests_rust/test_distribution.py --verify-manifest artifacts --source-commit "$SOURCE_SHA" --matrix-result success --artifact-metadata artifact-metadata.json > artifact-manifest.json
      - name: Assemble complete release set
        shell: bash
        run: |
          mkdir dist
          find artifacts -type f -name '*.whl' -exec cp '{}' dist/ \;
          find artifacts -type f -name '*.tar.gz' -exec cp '{}' dist/ \;
          cp artifact-manifest.json dist/
      - name: Verify complete release set
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python tests_rust/test_distribution.py --verify-release-set dist --manifest dist/artifact-manifest.json --source-commit "$SOURCE_SHA"
      - name: Upload complete release set
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-set
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publication-gates:
    if: ${{ inputs.publish_pypi || inputs.publish_crates }}
    needs: manifest
    runs-on: namespace-profile-puneet-chandna
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify exact-source qualification and environment protections
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.manifest.outputs.source_sha }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          PERFORMANCE_RUN: ${{ inputs.performance_run_id }}
          PUBLISH_PYPI: ${{ inputs.publish_pypi }}
          PUBLISH_CRATES: ${{ inputs.publish_crates }}
        shell: bash
        run: |
          [[ "$GITHUB_REPOSITORY" == puneet-chandna/requests-native ]]
          [[ "$GITHUB_REF" == refs/heads/main && "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          for qualification in "$SOURCE_RUN:.github/workflows/run-tests.yml" "$PERFORMANCE_RUN:.github/workflows/evaluate.yml"; do
            run_id=${qualification%%:*}
            workflow=${qualification#*:}
            [[ "$run_id" =~ ^[0-9]+$ ]]
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" | jq -e \
              --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" --arg workflow "$workflow" '
                .head_repository.full_name == $repo and .head_sha == $sha and
                .head_branch == "main" and .path == $workflow and
                (.event == "push" or .event == "workflow_dispatch") and
                .status == "completed" and .conclusion == "success"'
          done
          for environment in pypi crates-io; do
            if [[ "$environment" == pypi && "$PUBLISH_PYPI" != true ]] || \
               [[ "$environment" == crates-io && "$PUBLISH_CRATES" != true ]]; then continue; fi
            gh api "/repos/$GITHUB_REPOSITORY/environments/$environment" | jq -e '
              any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0) and
              .deployment_branch_policy.protected_branches == false and
              .deployment_branch_policy.custom_branch_policies == true'
            gh api "/repos/$GITHUB_REPOSITORY/environments/$environment/deployment-branch-policies" | jq -e '
              .branch_policies | length == 1 and .[0].name == "main" and .[0].type == "branch"'
          done
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.manifest.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Download qualified performance evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: performance-evidence
          path: performance-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.performance_run_id }}
      - name: Verify stable identity and recompute the full performance gate
        env:
          SOURCE_SHA: ${{ needs.manifest.outputs.source_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path
          from benchmarks.evaluate import compare_pairs, evaluator_digest

          workspace = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]
          assert workspace["version"] == "1.0.0", "Only the stable 1.0.0 candidate can publish"
          assert tomllib.loads(Path("crates/requests/Cargo.toml").read_text())["package"]["publish"] is True
          assert tomllib.loads(Path("crates/requests-python/Cargo.toml").read_text())["package"]["publish"] is False
          evidence = Path("performance-evidence")
          bases = sorted(evidence.glob("pair-*-base.json"))
          candidates = sorted(evidence.glob("pair-*-candidate.json"))
          assert candidates == [path.with_name(path.name.replace("-base.json", "-candidate.json")) for path in bases]
          pairs = [(json.loads(base.read_text()), json.loads(candidate.read_text())) for base, candidate in zip(bases, candidates)]
          assert all(report["evaluator_sha256"] == evaluator_digest() for pair in pairs for report in pair)
          assert all(pair[0]["git"]["rewrite_commit"] == "2146b22ed25951a5483cbb13d69dc551f99ff352" for pair in pairs), "The first stable release must use the immutable beta baseline"
          result = compare_pairs(pairs, budget=0.20, gate=True)
          assert result["sources"][1] == os.environ["SOURCE_SHA"]
          assert json.loads((evidence / "comparison.json").read_text()) == {**result, "smoke_only": False}
          assert result["status"] in ("passed", "inconclusive") and not result["insufficient_release_evidence"]
          assert all(metric["case"][0] == "python-oracle" or metric["status"] != "regression" for metric in result["metrics"]), "Confirmed native performance regressions block publication even when controls are unstable"
          if result["status"] == "inconclusive":
              print("::warning::Complete performance evidence is inconclusive; release policy permits publication without a performance parity or superiority claim. See comparison.json for unchanged ratios, confidence intervals and control uncertainty.")
          PY

  pypi:
    if: ${{ inputs.publish_pypi }}
    needs: [manifest, publication-gates]
    runs-on: namespace-profile-puneet-chandna
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/requests-native/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.manifest.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-set
          path: dist
      - name: Verify the release set immediately before upload
        env:
          SOURCE_SHA: ${{ needs.manifest.outputs.source_sha }}
        run: |
          cargo fetch --locked
          python tests_rust/test_distribution.py --verify-release-set dist --manifest dist/artifact-manifest.json --source-commit "$SOURCE_SHA"
          mkdir packages
          cp dist/*.whl dist/*.tar.gz packages/
      - name: Publish qualified archives to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/

  crates:
    if: ${{ inputs.publish_crates }}
    needs: [manifest, publication-gates]
    runs-on: namespace-profile-puneet-chandna
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/requests-native
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.manifest.outputs.source_sha }}
          persist-credentials: false
      - name: Verify publishable core archive
        run: |
          cargo publish -p requests-native --locked --dry-run
          cargo test --manifest-path target/package/requests-native-1.0.0/Cargo.toml --lib --locked
      - name: Publish the qualified core crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        # crates.io requires the first upload before trusted publishing can be configured:
        # https://blog.rust-lang.org/2025/07/11/crates-io-development-update-2025-07/
        # After bootstrap, replace this token with OIDC and remove the exception.
        run: | # zizmor: ignore[use-trusted-publishing] First-upload bootstrap is gated by protected crates-io job approval.
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo publish -p requests-native --locked --no-verify
