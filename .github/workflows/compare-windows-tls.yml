name: Compare Windows TLS source and build profiles

on:
  workflow_dispatch:
    inputs:
      qualify_current_release:
        description: "Run strict release qualification of this commit instead of historical controls"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-tls-profile-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: "1.98.0"
      QUALIFY_CURRENT_RELEASE: ${{ inputs.qualify_current_release }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.10"
          architecture: x64
      - name: Check out frozen Python oracle
        if: inputs.qualify_current_release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: psf/requests
          ref: 69f84847045bef7a849cc994a26fe7ba8a169e95
          path: frozen-oracle
          persist-credentials: false
      - name: Prepare fixed toolchain
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-tls-comparison/evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $toolchain = '1.98.0'
          if ($env:QUALIFY_CURRENT_RELEASE -eq 'true') {
            $toolchain = python -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          rustup toolchain install $toolchain --profile minimal *> "$evidence/toolchain-setup.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --retries 0 --timeout 30 "maturin==1.15.0" *> "$evidence/maturin-setup.log"
          exit $LASTEXITCODE
      - name: Build and test installed artifacts
        shell: pwsh
        run: |
          $qualification = @()
          if ($env:QUALIFY_CURRENT_RELEASE -eq 'true') {
            $qualification = @('--current-revision', $env:GITHUB_SHA, '--qualify-current-release', '--oracle-root', 'frozen-oracle')
          }
          python scripts/compare_windows_tls.py @qualification --output "$env:RUNNER_TEMP/windows-tls-comparison"
          exit $LASTEXITCODE
      - name: Retain private comparison logs even on failure
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-312-tls-profile-comparison-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/windows-tls-comparison/evidence/**/*.log
            ${{ runner.temp }}/windows-tls-comparison/evidence/**/*.json
          if-no-files-found: warn
          retention-days: 1
