name: Bootstrap Rust wheel matrix

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheel-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15-dev", "pypy-3.11"]
        os: [ubuntu-22.04, macos-latest, windows-latest]
        exclude:
          - {python: "pypy-3.11", os: windows-latest}

    env:
      CARGO_TERM_COLOR: always
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: ${{ matrix.python == '3.15-dev' && '1' || '' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install maturin
        run: python -m pip install --upgrade "maturin==1.15.0"

      - name: Set reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Compile every target and feature
        run: cargo check --workspace --all-targets --all-features

      - name: Build version-specific wheel
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            python scripts/build_release_wheel.py --interpreter python --manylinux 2_34 --out dist
          else
            python scripts/build_release_wheel.py --interpreter python --out dist
          fi

      - name: Verify exact wheel contents
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          python tests_rust/test_distribution.py --verify-wheel "$wheel" --source-commit "$GITHUB_SHA"

      - name: Install wheel into a fresh environment and import it
        shell: bash
        run: |
          python -m venv wheel-smoke
          wheel="$(python -c 'import glob; print(glob.glob("dist/*.whl")[0])')"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            smoke_python="wheel-smoke/Scripts/python.exe"
          else
            smoke_python="wheel-smoke/bin/python"
          fi
          "$smoke_python" -m pip install "$wheel"
          "$smoke_python" -c "import requests; from requests import _requests_rust; assert _requests_rust.backend_name() == 'requests-native'"
