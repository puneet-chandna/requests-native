# Requests Native modification notice: this retained file differs from Requests 2.34.2.
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "requests-native"
description = "Unofficial native Rust implementation of Requests with strict Python API compatibility."
readme = "README.md"
license-files = ["LICENSE", "NOTICE", "AUTHORS.rst", "RUST_RUNTIME_NOTICES.html"]
authors = [{ name = "Puneet Chandna" }]
maintainers = [{ name = "Puneet Chandna" }]
requires-python = ">=3.10"
dependencies = [
    "charset_normalizer>=2,<4",
    "idna>=2.5,<4",
    "urllib3>=1.26,<3",
    "certifi>=2023.5.7"
]
dynamic = ["version"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries"
]

[project.urls]
Homepage = "https://github.com/puneet-chandna/requests-native"
Documentation = "https://github.com/puneet-chandna/requests-native/tree/main/docs"
Source = "https://github.com/puneet-chandna/requests-native"
Issues = "https://github.com/puneet-chandna/requests-native/issues"
Upstream = "https://github.com/psf/requests"

[project.optional-dependencies]
security = []
socks = ["PySocks>=1.5.6, !=1.5.7"]
use_chardet_on_py3 = ["chardet>=3.0.2,<8"]

[dependency-groups]
test = [
    "requests-native[socks]",
    "pytest-httpbin==2.1.0",
    "httpbin~=0.10.0",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "pytest>=3",
    "PyYAML>=6",
    "tomli>=2; python_version < '3.11'",
    "trustme",
]
typecheck = [
    "pyright",
    "typing_extensions",
    "chardet",
    "cryptography",
    "PyOpenSSL",
]

[tool.maturin]
manifest-path = "crates/requests-python/Cargo.toml"
python-source = "src"
module-name = "requests._requests_rust"
bindings = "pyo3"
include = [
    { path = "HISTORY.md", format = "sdist" },
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "scripts/build_release_wheel.py", format = "sdist" },
    { path = "scripts/generate_release_sbom.py", format = "sdist" },
]

[tool.maturin.sbom]
rust = false

[tool.ruff]
target-version = "py310"
src = ["src/requests", "tests"]
exclude = ["docs/", "ext/"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "T10",    # flake8-debugger (replaces debug-statements hook)
]
ignore = ["E203", "E501", "UP031"]
per-file-ignores = {"src/requests/__init__.py" = ["E402", "F401"], "src/requests/compat.py" = ["E402", "F401"], "tests/compat.py" = ["F401"]}

[tool.ruff.lint.isort]
known-first-party = ["requests"]

[tool.ruff.format]
# Use black-compatible formatting
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
minversion = "6.2"
testpaths = ["tests"]


[tool.pyright]
include = ["src/requests"]
typeCheckingMode = "strict"
# linting rules unrelated to type checking
reportPrivateUsage = false
reportPrivateImportUsage = false
reportUnnecessaryIsInstance = false
reportUnusedImport = false  # duplicate of Ruff's F401 rule
