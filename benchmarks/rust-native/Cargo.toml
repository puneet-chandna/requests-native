[package]
name = "requests-benchmark-native"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bytes = "1"
crc32fast = "=1.5.2"
futures-core = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
requests = { package = "requests-native", path = "../../crates/requests" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
