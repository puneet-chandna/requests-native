[package]
name = "requests"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["blocking"]
blocking = ["tokio/rt-multi-thread"]
platform-smoke = [
    "dep:hyper-rustls",
    "hyper-util/client-legacy",
    "hyper-util/http1",
]

[dependencies]
async-compression = { version = "0.4.42", default-features = false, features = ["tokio", "gzip", "zlib", "deflate", "brotli", "zstd"] }
base64 = "0.22"
bytes = "1"
# Select zlib-rs for async-compression's flate2 backend; this edge is not called directly.
flate2 = { version = "=1.1.9", default-features = false, features = ["zlib-rs"] }
futures-core = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
indexmap = "2"
md-5 = "0.10"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"

[dev-dependencies]
bolero = "0.13.4"
