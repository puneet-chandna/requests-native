# Requests Native modification notice: this retained file differs from Requests 2.34.2.
exclude: 'docs/|ext/|^\.superpowers/'

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-toml
  - id: check-yaml
  - id: end-of-file-fixer
    # Preserve byte-canonical generated third-party license notices.
    exclude: ^RUST_RUNTIME_NOTICES\.html$
  - id: mixed-line-ending
    args: [--fix=auto]
  - id: trailing-whitespace
    exclude: ^RUST_RUNTIME_NOTICES\.html$
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.21
  hooks:
    - id: ruff-check
      args: [--fix]
    - id: ruff-format
      exclude: tests/test_lowlevel.py
